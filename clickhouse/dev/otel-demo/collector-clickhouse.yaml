receivers:
  host_metrics:
    root_path: ''
exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: default
    ttl: 72h
    create_schema: true
    async_insert: false
    sending_queue:
      enabled: true
      queue_size: 10000
      batch: {}
  prometheus_remote_write/clickhouse:
    http:
      endpoint: http://clickhouse:8123/prometheus/api/v1/write
      tls:
        insecure: true
    resource_constant_labels:
      included: ['*']
    remote_write_queue:
      num_consumers: 1
connectors:
  span_metrics:
    exemplars:
      enabled: true
service:
  pipelines:
    traces:
      exporters: [span_metrics, clickhouse]
    metrics:
      exporters: [clickhouse, prometheus_remote_write/clickhouse]
    logs:
      exporters: [clickhouse]
    profiles:
      exporters: [clickhouse]
